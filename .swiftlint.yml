# SwiftLint configuration of SecretSatan.
# scripts/lint.sh runs it before every build and fails the build above 3 violations.
# New code adds zero violations (see AGENTS.md). Do not relax these rules to make a build pass.

included:
  - SecretSatan
  - Packages/SecretSatanData/Sources
  - Packages/SecretSatanData/Tests
  - Packages/SecretSatanUI/Sources
  - Packages/SecretSatanUI/Tests

excluded:
  - Packages/SecretSatanData/.build
  - Packages/SecretSatanUI/.build
  - DerivedData
  - build
  # Generated by scripts/codegen/design_tokens.py from tokens.json.
  - Packages/SecretSatanUI/Sources/SecretSatanUI/Tokens

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

reporter: xcode
